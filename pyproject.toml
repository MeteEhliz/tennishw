[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tennishw"
version = "0.1.0"
description = "Get a tennis player's career matches from tennisabstract.com and plot player age vs. opponent age."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mete Ehliz" }]
dependencies = [
    "requests>=2.25",
    "pandas>=1.3",
    "matplotlib>=3.4",
]

[tool.setuptools.packages.find]
where = ["src"]